name: Deploy Web Openworld

on:
  push:
    branches: [main]
    paths:
      - '.site-source/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild and verify OfficeWalk3D site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat .site-source/OfficeWalk3D_v0.9.4-site.zip.b64.part* | base64 --decode > /tmp/officewalk-site.zip
          echo 'f15c5aab6d60063047e5f0d32dd2c616137cd5f3ba466e8611aaccab012fe6ce  /tmp/officewalk-site.zip' | sha256sum -c -
          unzip -tq /tmp/officewalk-site.zip
          unzip -q /tmp/officewalk-site.zip -d _site
          test -f _site/index.html
          test -f _site/src/main.js
          touch _site/.nojekyll
          echo "Site files:"
          find _site -maxdepth 2 -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
